<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work dashboard</title>
<link rel="icon" href="data:,">
<script>
  // Theme before first paint, so there is no flash. "system" (no attribute) follows the OS setting.
  (function () { var t = null; try { t = localStorage.getItem("eng-dashboard.theme"); } catch (e) { }
    if (/*theme-names*/["slate","graphite","ivory","rose","solarized","nord","dracula"]/*/theme-names*/.indexOf(t) >= 0) document.documentElement.setAttribute("data-theme", t); })();
</script>
<!--
  eng-agents dashboard template. Two modes, one file:
  - Static: New-Dashboard.ps1 replaces the data block below with the current state
    of .work and the workspace repos. No network access: system fonts only, no
    external scripts.
  - Live: live-server.mjs serves it with "liveMode" in the data. The page then
    follows the server's event stream and can run commands in opencode.
-->
<style>
/* themes:begin  Copied from shared/themes.css in Workshop (workshop repo) by sync-themes.mjs.
   Do not edit here: change it there, then run node sync-themes.mjs. */
:root,
:root[data-theme=slate]    {--bg:#F7F7F8;--surface:#FFFFFF;--ink:#1C1D21;--muted:#5C5F66;--accent:#4F46E5;--on-accent:#FFFFFF;--danger:#B42318;--warn:#94570A;color-scheme:light}
:root[data-theme=graphite] {--bg:#141518;--surface:#1C1E22;--ink:#E8E9EC;--muted:#A0A4AB;--accent:#8C88FF;--on-accent:#141518;--danger:#F97066;--warn:#E3A64A;color-scheme:dark}
:root[data-theme=ivory]    {--bg:#FBF8F1;--surface:#FFFDF8;--ink:#3A3230;--muted:#6B5F59;--accent:#9C5A6A;--on-accent:#FFFFFF;--danger:#B42318;--warn:#8F560B;color-scheme:light}
:root[data-theme=rose]     {--bg:#FBF4F2;--surface:#FFFAF9;--ink:#3B2F33;--muted:#6F5D63;--accent:#A04F6C;--on-accent:#FFFFFF;--danger:#B42318;--warn:#8F560B;color-scheme:light}
:root[data-theme=solarized]{--bg:#FDF6E3;--surface:#FFFCF4;--ink:#073642;--muted:#4F646B;--accent:#1F6FA8;--on-accent:#FFFFFF;--danger:#B42318;--warn:#8A5A00;color-scheme:light}
:root[data-theme=nord]     {--bg:#2E3440;--surface:#3B4252;--ink:#ECEFF4;--muted:#BCC4D2;--accent:#88C0D0;--on-accent:#2E3440;--danger:#F4B6BC;--warn:#EBCB8B;color-scheme:dark}
:root[data-theme=dracula]  {--bg:#282A36;--surface:#303241;--ink:#F8F8F2;--muted:#B0B6D3;--accent:#BD93F9;--on-accent:#282A36;--danger:#FF9494;--warn:#FFB86C;color-scheme:dark}
/* No theme set: follow the system (Graphite when it is dark). */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){--bg:#141518;--surface:#1C1E22;--ink:#E8E9EC;--muted:#A0A4AB;--accent:#8C88FF;--on-accent:#141518;--danger:#F97066;--warn:#E3A64A;color-scheme:dark}
}
:root{
  --line:color-mix(in srgb,var(--ink) 12%,var(--surface));
  --hover:color-mix(in srgb,var(--ink) 5%,var(--surface));
  --sunk:color-mix(in srgb,var(--ink) 4%,var(--bg));
  --side:color-mix(in srgb,var(--ink) 3%,var(--bg));
  --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface));
  --danger-soft:color-mix(in srgb,var(--danger) 10%,var(--surface));
  --warn-soft:color-mix(in srgb,var(--warn) 14%,var(--surface));
  --shadow:0 1px 2px color-mix(in srgb,var(--ink) 8%,transparent),0 8px 24px -10px color-mix(in srgb,var(--ink) 22%,transparent);
  --shadow-lg:0 2px 6px color-mix(in srgb,var(--ink) 10%,transparent),0 24px 48px -16px color-mix(in srgb,var(--ink) 35%,transparent);
  /* No web fonts, so both apps work offline: Inter and JetBrains Mono when installed, else system fonts. */
  --sans:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}
/* themes:end */
:root {
  /* State names the page uses: go = moving or approved, gate = needs you, stop = failed, hold = paused. */
  --go: var(--accent); --go-soft: var(--accent-soft); --on-go: var(--on-accent);
  --gate: var(--warn); --gate-soft: var(--warn-soft);
  --stop: var(--danger); --stop-soft: var(--danger-soft);
  --hold: var(--muted); --hold-soft: var(--hover);
  --focus: var(--accent);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14.5px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--mono); font-size: 0.9em; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 24px 64px; }

/* ---------- top bar */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo i { display: block; width: 12px; height: 2px; border-radius: 2px; background: var(--on-accent); box-shadow: 0 4px 0 color-mix(in srgb, var(--on-accent) 75%, transparent), 0 -4px 0 var(--on-accent); }
.top h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.015em; white-space: nowrap; }
.top .ver { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.top .ws { color: var(--muted); font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.top .fresh { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stale { color: var(--gate); font-weight: 600; }

/* ---------- layout */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
@media (max-width: 1020px) { .grid { grid-template-columns: minmax(0, 1fr); } }
aside { display: grid; gap: 20px; }

/* ---------- cards share one shape: surface, hairline border, a 4px state bar on the left */
.pickup, .item { position: relative; background: var(--surface); border: 1px solid var(--line); }
.pickup::before, .item::before {
  content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px;
  background: var(--state, transparent); border-radius: inherit; border-top-right-radius: 0; border-bottom-right-radius: 0;
}

/* ---------- pick up here */
.pickup { border-radius: 14px; padding: 18px 22px 16px 24px; margin-bottom: 18px; box-shadow: var(--shadow); }
.pick-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pickup .eyebrow { color: var(--muted); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin: 0 0 6px; }
.pickup h2 { margin: 0 0 14px; font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
.pickup h2 a { text-decoration: none; }
.pickup h2 .num { color: var(--muted); font-weight: 500; margin-right: 6px; font-family: var(--mono); font-size: .8em; }
.pickup .track { margin: 6px 0 18px; }
.do {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.do .cmd { font-family: var(--mono); font-size: 19px; font-weight: 500; letter-spacing: -0.01em; word-break: break-all; }
.do .act { font-size: 16px; font-weight: 600; }
.do .then { color: var(--muted); font-size: 13.5px; }
.pickup .why { margin: 12px 0 0; color: var(--muted); }
.pickup .why strong { color: var(--ink); font-weight: 600; }

/* ---------- counts */
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 26px; padding: 0; list-style: none; }
.counts a {
  display: inline-flex; gap: 8px; align-items: baseline; text-decoration: none; font-weight: 500;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted);
}
.counts a:hover { background: var(--hover); color: var(--ink); }
.counts a b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.counts a[data-b="needs"] b { color: var(--gate); }
.counts a[data-b="ship"] b { color: var(--go); }
.counts a.zero { opacity: .55; }

/* ---------- groups and items */
section.group { margin-bottom: 30px; }
section.group > h3, aside h3 {
  font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted);
  margin: 0 0 10px 2px; display: flex; gap: 8px; align-items: baseline;
}
section.group > h3 .n, aside h3 .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; }
section.group > p.hint { margin: -4px 0 10px 2px; color: var(--muted); font-size: 13px; }
.items { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.item { border-radius: 12px; padding: 14px 16px 12px 18px; }
.item:hover { border-color: color-mix(in srgb, var(--ink) 20%, var(--surface)); }
.item-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.item-head .t { font-size: 15.5px; font-weight: 600; margin: 0; flex: 1 1 320px; min-width: 0; letter-spacing: -0.005em; }
.item-head .t .num { color: var(--muted); font-weight: 500; margin-right: 6px; font-family: var(--mono); font-size: .85em; }
.item-head .t a { text-decoration: none; }
.item-head .t a:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag {
  display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 500; padding: 1px 9px; border-radius: 999px;
  background: var(--hover); color: var(--muted); line-height: 1.5;
}
.tag.bug { background: var(--stop-soft); color: var(--stop); }
.tag.feature { background: var(--go-soft); color: var(--ink); }

.next-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0 0; }
.next-line .lbl, .left-off .lbl { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; min-width: 64px; }
.next-line .cmd { font-family: var(--mono); font-weight: 500; }
.next-line .act { font-weight: 600; }
.next-line .then { color: var(--muted); font-size: 13px; }
.left-off { margin: 8px 0 0; display: flex; gap: 12px; }
.left-off .lbl { padding-top: 3px; }
.left-off .body { min-width: 0; }
.left-off .when { color: var(--muted); font-size: 13px; }
.alert { color: var(--stop); font-weight: 600; }
.held { color: var(--hold); font-weight: 600; }

details { margin-top: 10px; }
details > summary {
  cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; list-style: none; display: inline-flex; gap: 6px; align-items: center;
  border-radius: 6px; padding: 1px 4px; margin-left: -4px;
}
details > summary:hover { color: var(--ink); background: var(--hover); }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.detail-body { margin-top: 8px; display: grid; gap: 12px; }

/* ---------- the track: done stages are checked, the current one is a filled label in the item's
   state color with what is happening under it, later stages are faint with a dashed line */
.track { display: flex; align-items: flex-start; margin: 14px 0 2px; overflow-x: auto; padding: 4px 2px 2px; }
.stop { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 50px; flex: 0 0 auto; }
.stop .dot {
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, var(--surface)); background: var(--surface);
}
.stop .dot svg { width: 11px; height: 11px; display: block; }
.stop .name { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px; white-space: nowrap; color: color-mix(in srgb, var(--muted) 75%, var(--surface)); }
.stop .sub { font-size: 11px; line-height: 14px; min-height: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stop.done .dot { background: var(--go); border: 0; color: var(--on-go); }
.stop.done .name { color: var(--ink); }
.stop.here .dot { width: 22px; height: 22px; margin: -2px 0; border: 0; background: var(--state); box-shadow: 0 0 0 4px color-mix(in srgb, var(--state) 22%, transparent); }
.stop.here .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); }
.stop.here .name { background: var(--state); color: var(--surface); font-weight: 600; }
.stop.here .sub { color: var(--ink); font-weight: 600; }
.rail { flex: 1 1 24px; min-width: 14px; height: 0; margin-top: 8px; border-top: 2px dashed color-mix(in srgb, var(--muted) 40%, var(--surface)); }
.rail.done { border-top-style: solid; border-color: var(--go); }
.pickup .stop { min-width: 58px; }
.pickup .stop .name { font-size: 12.5px; }

/* ---------- tables */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; }
.links { display: flex; gap: 10px; flex-wrap: wrap; white-space: nowrap; }
.flag { display: inline-flex; font-size: 11.5px; font-weight: 500; padding: 0 8px; border-radius: 999px; margin: 1px 4px 1px 0; white-space: nowrap; line-height: 1.6; }
.flag.warn { background: var(--gate-soft); color: var(--gate); }
.flag.bad { background: var(--stop-soft); color: var(--stop); }
.flag.info { background: var(--hover); color: var(--muted); }
.flag.ok { color: var(--muted); padding-left: 0; }
.branch { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.dim { color: var(--muted); }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; }
.tasks li { display: flex; gap: 8px; align-items: baseline; }
.tasks .box { width: 15px; height: 15px; border: 1.5px solid var(--muted); border-radius: 50%; flex: 0 0 15px; position: relative; top: 3px; }
.tasks li.done .box { background: var(--muted); border-color: var(--muted); }
.tasks li.done .box::after { content: ""; position: absolute; left: 4px; top: 1.5px; width: 3.5px; height: 7px; border: solid var(--surface); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); }
.tasks li.done .tt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tasks li.first .tt { font-weight: 600; }
.tasks .rp { color: var(--muted); font-size: 12px; }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.kit { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
.kit-line { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.kit-line code { font-size: 12.5px; word-break: break-all; }
.kit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kit-head span { color: var(--muted); font-size: 13px; }
.pre { white-space: pre-wrap; font-size: 13.5px; margin: 0; }
.files { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; font-family: var(--mono); }
.sub-h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }

.copy {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 2px 9px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--muted); flex: 0 0 auto; min-height: 26px;
}
.copy:hover { color: var(--ink); background: var(--hover); }
.copy.ok { color: var(--ink); background: var(--accent-soft); border-color: transparent; }
.do .copy { font-size: 13px; padding: 4px 12px; margin-left: auto; min-height: 32px; }

/* ---------- sidebar */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.repo-list { list-style: none; margin: 0; padding: 0; display: grid; }
.repo-list li { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.repo-list li:last-child { border-bottom: 0; }
.repo-list .rn { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.repo-list .rn a { font-weight: 500; font-size: 12.5px; color: var(--accent); text-decoration: none; }
.repo-list .rn a:hover { text-decoration: underline; }
.repo-list .lc { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clean-list { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

.timeline { list-style: none; margin: 0; padding: 0; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.day:first-child { margin-top: 0; }
.ev { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 4px 0; font-size: 13.5px; }
.ev .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-top: 7px; }
.ev.fail .pip { background: var(--stop); }
.ev.pass .pip { background: var(--go); }
.ev .it { display: block; font-weight: 500; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev a.it:hover { text-decoration: underline; }
.ev .it .num { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 5px; }
.ev .w { display: block; color: var(--muted); font-size: 12.5px; }

/* ---------- PR text (ready to ship) */
.prbox { margin-top: 12px; display: grid; gap: 10px; }
.prbox > .sub-h { margin: 0; }
.pr { border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); padding: 10px 12px; display: grid; gap: 10px; min-width: 0; }
.pr-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pr-head .rn { font-weight: 600; }
.pr-head .row { margin-left: auto; }
.pr-push { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.pr-push code { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; word-break: break-all; }
.pr-field { display: grid; gap: 4px; min-width: 0; }
.pr-field .fh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pr-field .fh .sub-h { margin: 0; }
.pr-title { font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.pr-desc { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; }
a.btn { text-decoration: none; }

/* ---------- remove an item */
.btn.remove { min-height: 24px; padding: 0 9px; font-size: 12px; color: var(--muted); border-color: transparent; background: transparent; }
.btn.remove:hover { color: var(--stop); background: var(--stop-soft); }
.btn.destroy { background: var(--stop); border-color: var(--stop); color: var(--surface); }
.btn.destroy:hover { background: color-mix(in srgb, var(--stop) 88%, var(--ink)); }
.btn.destroy:disabled:hover { background: var(--stop); }
.sheet .confirm { display: grid; gap: 6px; margin-top: 14px; font-size: 13.5px; }
.sheet .confirm input { font: inherit; font-family: var(--mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); outline: none; width: min(260px, 100%); }
.sheet .confirm input:focus { border-color: var(--stop); }
.sheet ul.gone { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink); }
.sheet ul.gone li { margin: 2px 0; }

.empty { background: transparent; border: 1.5px dashed var(--line); border-radius: 12px; padding: 30px 22px; text-align: center; color: var(--muted); }
.empty h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; color: var(--ink); }
.empty p { margin: 0 0 12px; }
.empty .do { display: inline-flex; }
.note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* ---------- buttons, pills, menus (live mode and header) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 12px;
  font-size: 13px; font-weight: 500; cursor: pointer; flex: 0 0 auto; line-height: 1.4; color: var(--ink); white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.ibtn svg { width: 17px; height: 17px; display: block; }
.pill {
  display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 500; padding: 2px 10px; min-height: 26px;

.ovr { border: 1px solid color-mix(in srgb, var(--gate) 45%, var(--surface)); background: var(--gate-soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13.5px; }

.agent { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }

.auto .msg { margin: 0; }
.auto .hist { margin: 4px 0 0; }

.spin {
  width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px;

  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font: 13.5px/1.5 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; margin: 0;
}
.say-h { font-size: 12px; color: var(--muted); margin: 0 0 -4px; }
.ask { border: 1px solid var(--gate); background: var(--gate-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.ask .q { font-weight: 600; margin: 0; }
.ask .q-h { font-size: 11px; font-weight: 600; color: var(--gate); text-transform: uppercase; letter-spacing: .06em; margin: 0; }

.ask input[type="text"] { font: inherit; font-size: 13.5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; outline: none; }

.reply { display: flex; gap: 8px; align-items: flex-end; }

  flex: 1; min-width: 0; min-height: 38px; height: 38px; resize: vertical; font: inherit; font-size: 13.5px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); outline: none;
}

.waiting { display: grid; gap: 10px; margin: 0 0 18px; }
.waiting .ask { background: var(--surface); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.hist li { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.hist .ht { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(560px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow-lg); animation: pop .16s ease; }

@media (max-width: 600px) {
  .wrap { padding: 14px 16px 48px; }
  .top .fresh { margin-left: 0; }
  .agent-head .row { margin-left: 0; }
  .reply { flex-direction: column; align-items: stretch; }
  .do .cmd { font-size: 16px; }
  .pickup { padding: 16px 16px 14px 18px; }
  .pickup h2 { font-size: 18.5px; }
  .next-line .lbl, .left-off .lbl { min-width: 0; }
  .left-off { flex-direction: column; gap: 0; }

  .rail, .pickup .rail { min-width: 8px; }

}
/* ---------- embedded in a shell: the shell shows the name and owns the theme */
.embed .brand { display: none; }
.embed .wrap { padding-top: 14px; }
.picked {
  display: flex; gap: 10px; align-items: baseline; text-decoration: none; min-width: 0;
  border: 1px dashed var(--line); border-left: 4px solid var(--state); border-radius: 12px; padding: 9px 14px; font-size: 13.5px; color: var(--ink);
}
.picked:hover { background: var(--hover); }
.picked .num { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

<body>
<div class="wrap" id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="application/json" id="eng-data">__ENG_DATA__</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var D;
  try { D = JSON.parse(document.getElementById("eng-data").textContent); }
  catch (e) {
    app.innerHTML = '<div class="empty"><h2>No data in this page</h2><p>This is the dashboard template. Run <code>/dashboard</code> in opencode, or <code>New-Dashboard.ps1</code>, to build the real page.</p></div>';
    return;
  }

  // Live mode: served by live-server.mjs, which adds D.liveMode.
  var LIVE = !!D.liveMode;
  var L = LIVE ? D.liveMode.live : null;   // opencode state: sessions, prompts, item links
  var conn = LIVE ? "connecting" : null;  // page <-> live server
  // Embedded: framed by a shell site the server allows (Workshop), opened as /?embed=1. Live only.
  var embedOrigins = LIVE ? (D.liveMode.embedOrigins || []) : [];
  var EMBED = LIVE && /[?&]embed=1(&|$)/.test(location.search) && window.parent !== window && embedOrigins.length > 0;
  if (EMBED) document.documentElement.classList.add("embed");

  // ---------------------------------------------------------------- helpers
  function h(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function md(s) {
    // Inline `code` and **bold** only, plus "- " list lines as bullets. Everything else stays plain text.
    return h(s).replace(/^\s*[-*]\s+/gm, "• ").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function link(href, text, cls) {
    if (!href) return h(text);
    return '<a href="' + h(href) + '" target="_blank" rel="noopener"' + (cls ? ' class="' + cls + '"' : "") + ">" + h(text) + "</a>";
  }
  function fileHref(folder, name) {
    return (LIVE ? "files/" : "") + encodeURIComponent(folder) + "/" + encodeURIComponent(name);
  }
  var copyStore = [];
  function copyBtn(text, label) {
    copyStore.push(text);
    return '<button type="button" class="copy" data-copy="' + (copyStore.length - 1) + '" aria-label="Copy ' + h(text) + '">' + (label || "Copy") + "</button>";
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

  var now, today, yest;
  function ago(ms) {
    var m = Math.round((now - ms) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    var hr = Math.round(m / 60);
    if (hr < 24) return plural(hr, "hour") + " ago";
    var d = Math.round(hr / 24);
    if (d < 14) return plural(d, "day") + " ago";
    return Math.round(d / 7) + " weeks ago";
  }
  function dayKey(d) {
    var y = d.getFullYear(), m = ("0" + (d.getMonth() + 1)).slice(-2), dd = ("0" + d.getDate()).slice(-2);
    return y + "-" + m + "-" + dd;
  }
  function dayName(s) {
    var k = (s || "").slice(0, 10);
    if (k === today) return "Today";
    if (k === yest) return "Yesterday";
    var p = k.split("-");
    if (p.length !== 3) return s;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function timeOf(ms) { return new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }

  // ------------------------------------------------------------ live state helpers
  function ocReady() { return LIVE && conn === "on" && L && L.opencode && L.opencode.connected; }
  function itemSession(it) {
    if (!LIVE || !L || !L.items[it.folder]) return null;
    var id = L.items[it.folder].current;
    return id && L.sessions[id] ? L.sessions[id] : null;
  }
  function itemPerms(it) { return LIVE && L ? L.permissions.filter(function (p) { return p.folder === it.folder; }) : []; }
  function itemQs(it) { return LIVE && L ? L.questions.filter(function (q) { return q.folder === it.folder; }) : []; }
  function isBusy(s) { return !!s && s.status && s.status !== "idle"; }
  function asking(it) { return itemPerms(it).length + itemQs(it).length > 0; }
  function itemAuto(it) { return LIVE && L && L.autopilot ? L.autopilot[it.folder] || null : null; }
  function autoIs(it, status) { var a = itemAuto(it); return !!a && a.status === status; }
  function bucketOf(it) {
    if (LIVE && it.kind === "item" && (asking(it) || autoIs(it, "waiting"))) return "needs";
    if (LIVE && it.kind === "item" && autoIs(it, "running") && it.bucket === "needs") return "active";
    if (LIVE && it.kind !== "item" && asking(it)) return "notes";
    return it.bucket;
  }
  // A command to run for spikes, docs, and TSDs, from their "next" text: the first `/command ...`.
  function noteCommand(it) {
    var m = /`(\/[a-z][a-z0-9-]*[^`]*)`/i.exec(it.nextText || "");
    return m ? m[1].trim() : null;
  }

  // UI state that must survive re-rendering: open sections, reply drafts, question picks, focus.
  var ui = { open: {}, drafts: {}, picks: {}, busy: {}, menu: null, sheet: false, remove: null };
  function openAttr(key, dflt) {
    var v = ui.open.hasOwnProperty(key) ? ui.open[key] : dflt;
    return ' data-key="' + h(key) + '"' + (v ? " open" : "");
  }

  // ------------------------------------------------------------ state colors
  function stateVar(it) {
    if (LIVE && (asking(it) || autoIs(it, "waiting"))) return "var(--gate)";
    if (it.bucket === "paused") return "var(--hold)";
    if (it.blocked) return "var(--stop)";
    if (bucketOf(it) === "needs") return "var(--gate)";
    return "var(--go)";
  }

  // --------------------------------------------------------------- the track
  var STOPS = {
    feature: [["start", "Start"], ["spec", "Spec", "spec"], ["plan", "Plan", "plan"], ["tasks", "Tasks"], ["build", "Build"], ["review", "Review", "review"], ["pr", "PR"]],
    bug: [["start", "Start"], ["bug", "Bug", "bug"], ["build", "Build"], ["review", "Review", "review"], ["pr", "PR"]]
  };
  var CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg>';
  // What is happening at the current stage, in a word or two, shown under its label.
  function hereSub(it, key) {
    if (it.paused) return "Paused";
    if (it.blocked) return "Blocked";
    if (LIVE && asking(it)) return "Waiting on you";
    if (LIVE && (autoIs(it, "running") || isBusy(itemSession(it)))) return "Working";
    if (it.stage === "ship") return "Ready to open";
    var n = it.next || {};
    if (n.needsYou) return key === "review" ? "Pick fixes" : "Approve";
    if (key === "build" && it.tasks && it.tasks.total) return it.tasks.done + " of " + it.tasks.total + " done";
    return "Up next";
  }
  // Tooltip for a stage that is behind the item.
  function doneTip(it, key) {
    var g = { spec: "spec", plan: "plan", bug: "bug", review: "review" }[key];
    var v = g && it.gates ? it.gates[g] : null;
    if (v === "APPROVED") return key + ".md approved";
    if (v === "READY") return "Review: READY";
    if (key === "build" && it.tasks && it.tasks.total) return plural(it.tasks.total, "task") + " done";
    return "Done";
  }
  function track(it) {
    var stops = STOPS[it.lane] || STOPS.feature;
    var idx = -1;
    for (var i = 0; i < stops.length; i++) if (stops[i][0] === it.stage) idx = i;
    if (it.stage === "ship") idx = stops.length - 1; // PR text written: the PR stage is where it waits
    var out = '<div class="track" role="img" aria-label="' + h(trackLabel(it, stops, idx)) + '" style="--state:' + stateVar(it) + '">';
    for (var j = 0; j < stops.length; j++) {
      var key = stops[j][0];
      var cls = j < idx ? "done" : (j === idx ? "here" : "");
      var sub = cls === "here" ? hereSub(it, key) : (cls === "done" && key === "build" && it.tasks && it.tasks.total ? it.tasks.done + "/" + it.tasks.total : "");
      var tip = cls === "done" ? doneTip(it, key) : cls === "here" ? "Now: " + stops[j][1] + ", " + sub : "Not started";
      out += '<div class="stop ' + cls + '" title="' + h(tip) + '"><span class="dot">' + (cls === "done" ? CHECK : "") + '</span><span class="name">' + stops[j][1] + '</span><span class="sub">' + h(sub) + "</span></div>";
      if (j < stops.length - 1) out += '<div class="rail' + (j < idx ? " done" : "") + '"></div>';
    }
    return out + "</div>";
  }
  function trackLabel(it, stops, idx) {
    if (idx < 0) return "Stage unknown";
    return "Stage " + (idx + 1) + " of " + stops.length + ": " + stops[idx][1] + ", " + hereSub(it, stops[idx][0]);
  }

  // --------------------------------------------------------------- next step
  // label: the button text (default "Run"). quiet: a secondary button next to a primary one.
  function runBtn(it, cmd, label, quiet) {
    if (!LIVE || !cmd) return "";
    var s = itemSession(it);
    var fresh = /^\/(do-task|check-docs)\b/.test(cmd);
    var blocked = !ocReady() ? "opencode is not connected" : (autoIs(it, "running") ? "Autopilot is running this item" : (isBusy(s) && !fresh ? "This item's session is still working" : (ui.busy[it.folder] ? "Starting" : "")));
    var tip = blocked || ("Runs " + cmd + " in opencode" + (fresh ? " in a new session" : (s ? " in this item's session" : " in a new session for this item")));
    return '<button type="button" class="btn' + (quiet ? "" : " primary") + '" data-run="' + h(it.folder) + '" data-cmd="' + h(cmd) + '" title="' + h(tip) + '"' + (blocked ? " disabled" : "") + ">" + h(label || "Run") + "</button>";
  }

  // The file to read before approving, for "Review spec.md" style steps.
  function gateFileLink(it) {
    if (it.paused || !it.next || !it.next.needsYou) return "";
    var f = { spec: "spec.md", plan: "plan.md", bug: "bug.md", review: "review.md" }[it.next.stage];
    if (!f || !it.files || it.files.indexOf(f) < 0) return "";
    return '<a href="' + fileHref(it.folder, f) + '" target="_blank" rel="noopener" class="then">Open ' + h(f) + "</a>";
  }

  // Live: the step in plain words and one main button. Commands stay in the button's tooltip.
  // The words come from New-Dashboard.ps1 (stepWords), the one place that defines them.
  function cmdWords(it, cmd) {
    var p = String(cmd).split(/\s+/), name = p[0].replace(/^\//, "");
    if (name === "do-task") {
      var n = +p[2], t = ((it.tasks && it.tasks.list) || []).filter(function (x) { return x.n === n; })[0];
      return "Task " + n + (t ? ": " + t.title : "");
    }
    return (D.stepWords || {})[name] || cmd;
  }
  function liveNextHtml(it, big) {
    var n = it.next || {};
    var cmd = it.paused ? "/resume " + it.id : n.command;
    var act = it.paused ? null : n.action;
    var running = autoIs(it, "running");
    var kind = running || autoIs(it, "waiting") ? null : autoStartKind(it);
    var name = cmd ? cmd.split(/\s+/)[0] : "";
    var text = act ? md(act) : cmd ? h(cmdWords(it, cmd)) : "";
    var btns = "";
    if (!running) {
      if (kind) btns += autoBtn(it, kind, kind === "approve-start" ? "Approve and build" : "Build with autopilot", "primary", autoTip(it, kind), "");
      if (cmd) btns += runBtn(it, cmd, name === "/approve" ? (kind ? "Approve only" : "Approve") : name === "/resume" ? "Resume" : kind ? "Run next step only" : "Run", !!kind || autoIs(it, "waiting"));
    }
    var note = n.note && !it.paused ? liveNote(n.note) : "";
    if (big) {
      return '<div class="do"><span class="act">' + text + "</span>" + gateFileLink(it) +
        (btns ? '<span class="row" style="margin-left:auto">' + btns + "</span>" : "") + "</div>";
    }
    return '<div class="next-line"><span class="lbl">Next</span><span class="act">' + text + "</span>" + gateFileLink(it) + btns +
      (note ? '<span class="then">' + md(note) + "</span>" : "") + "</div>";
  }

  function nextHtml(it, big) {
    if (LIVE) return liveNextHtml(it, big);
    var n = it.next || {};
    var cmd = it.paused ? "/resume " + it.id : n.command;
    var act = it.paused ? null : n.action;
    var parts = [];
    if (big) {
      if (act) {
        parts.push('<span class="act">' + md(act) + "</span>");
        if (cmd) parts.push('<span class="then">then <code>' + h(cmd) + "</code></span>");
        if (cmd) parts.push('<span class="row" style="margin-left:auto">' + copyBtn(cmd, "Copy " + h(cmd.split(" ")[0])) + "</span>");
      } else if (cmd) {
        parts.push('<span class="cmd">' + h(cmd) + "</span>");
        parts.push('<span class="row" style="margin-left:auto">' + copyBtn(cmd) + "</span>");
      }
      return '<div class="do">' + parts.join("") + "</div>";
    }
    var out = '<div class="next-line"><span class="lbl">Next</span>';
    if (act) {
      out += '<span class="act">' + md(act) + "</span>";
      if (cmd) out += '<span class="then">then <code>' + h(cmd) + "</code></span>" + copyBtn(cmd);
    } else if (cmd) {
      out += '<span class="cmd">' + h(cmd) + "</span>" + copyBtn(cmd);
    }
    if (n.note && !it.paused) out += '<span class="then">' + md(n.note) + "</span>";
    return out + "</div>";
  }
  // The live page opens new sessions by itself, so drop "start a new session" advice.
  function liveNote(note) {
    return String(note).replace(/\s*After approval:.*$/i, "").replace(/\s*Start a new session \(\/new\)( first| before \/do-task)?\.?/gi, "").replace(/Start a new session,? (and run|then) /gi, "Run ").trim();
  }

  function leftOffHtml(it) {
    var body = "";
    if (it.paused) {
      var p = it.paused;
      body += '<span class="held">Paused' + (p.since ? " since " + h(p.since) : "") + "</span>" + (p.reason ? ": " + md(p.reason) : ".");
      if (p.inProgress && !/^none/i.test(p.inProgress)) body += "<br>In progress: " + md(p.inProgress);
      if (p.wip) body += '<div class="pre">' + md(p.wip) + "</div>";
      if (p.waiting) body += '<div><span class="dim">Waiting on:</span> <span class="pre">' + md(p.waiting) + "</span></div>";
    } else if (it.last) {
      var l = it.last;
      body += '<span class="when">' + h(dayName(l.date)) + ", <code>" + h(l.command) + "</code>" + (l.agent ? " (" + h(l.agent) + ")" : "") + ":</span> " + md(l.did || "No summary.");
      if (it.blocked) body += '<br><span class="alert">Blocked:</span> ' + md(it.blocked);
      else if (l.notes) body += '<br><span class="dim">Notes:</span> ' + md(l.notes);
      if (l.verify && !it.blocked) body += '<br><span class="dim">Verify:</span> ' + md(l.verify);
    } else {
      body = '<span class="dim">Nothing in progress.md yet.</span>';
    }
    return '<div class="left-off"><span class="lbl">Left off</span><div class="body">' + body + "</div></div>";
  }

  // ------------------------------------------------------------- agent panel (live)
  function permHtml(p, showWho) {
    var s = L.sessions[p.sessionID];
    var what = p.title || (p.patterns || []).join(", ");
    var who = showWho ? '<p class="q-h">' + h((s && s.title) || p.sessionID) + "</p>" : "";
    var always = (p.always || []).length ? " (" + (p.always || []).join(", ") + ")" : "";
    return '<div class="ask">' + who +
      '<p class="q">Allow <strong>' + h(p.permission) + "</strong>" + (what ? ": <code>" + h(what) + "</code>" : "") + "</p>" +
      '<div class="row">' +
      '<button type="button" class="btn warn" data-perm="' + h(p.id) + '" data-answer="once">Allow once</button>' +
      '<button type="button" class="btn" data-perm="' + h(p.id) + '" data-answer="always" title="Stop asking for this in this session' + h(always) + '">Always allow</button>' +
      '<button type="button" class="btn danger" data-perm="' + h(p.id) + '" data-answer="reject">Reject</button>' +
      "</div></div>";
  }

  function questionHtml(q, showWho) {
    var s = L.sessions[q.sessionID];
    var picks = ui.picks[q.id] || {};
    var out = '<div class="ask" data-qform="' + h(q.id) + '">';
    if (showWho) out += '<p class="q-h">' + h((s && s.title) || q.sessionID) + "</p>";
    (q.questions || []).forEach(function (qq, i) {
      var name = q.id + "-" + i;
      var chosen = picks[i] || [];
      out += (qq.header ? '<p class="q-h">' + h(qq.header) + "</p>" : "") + '<p class="q">' + md(qq.question) + '</p><div class="opts">';
      (qq.options || []).forEach(function (o) {
        var on = chosen.indexOf(o.label) >= 0;
        out += '<label><input type="' + (qq.multiple ? "checkbox" : "radio") + '" name="' + h(name) + '" value="' + h(o.label) + '" data-qpick="' + h(q.id) + '" data-qi="' + i + '"' + (on ? " checked" : "") + ">" +
          "<span>" + h(o.label) + (o.description ? ' <span class="d">' + h(o.description) + "</span>" : "") + "</span></label>";
      });
      if (qq.custom !== false) {
        var draftKey = "q:" + q.id + ":" + i;
        out += '<input type="text" placeholder="Or type your own answer" data-draft="' + h(draftKey) + '" value="' + h(ui.drafts[draftKey] || "") + '">';
      }
      out += "</div>";
    });
    out += '<div class="row"><button type="button" class="btn warn" data-qsend="' + h(q.id) + '">Answer</button>' +
      '<button type="button" class="btn" data-qreject="' + h(q.id) + '">Dismiss</button></div></div>';
    return out;
  }

  // ---------------------------------------------------------- autopilot
  // Which start button fits: approve the waiting plan or bug analysis first, or start from an approved one.
  function autoStartKind(it) {
    if (it.kind !== "item" || it.paused) return null;
    var n = it.next || {};
    if (n.command && /^\/approve\b/.test(n.command) && (n.stage === "plan" || n.stage === "bug")) return "approve-start";
    var gate = it.lane === "bug" ? it.gates.bug : it.gates.plan;
    return gate === "APPROVED" && n.stage !== "ship" ? "start" : null;
  }
  function autoBtn(it, act, label, cls, tip, off) {
    var dis = off || (!ocReady() && act !== "stop" && act !== "dismiss" ? "opencode is not connected" : (ui.busy["a:" + it.folder] ? "Working" : ""));
    return '<button type="button" class="btn' + (cls ? " " + cls : "") + '" data-auto="' + h(it.folder) + '" data-act="' + act + '" title="' + h(dis || tip) + '"' + (dis ? " disabled" : "") + ">" + h(label) + "</button>";
  }
  function autoTip(it, kind) {
    return (kind === "approve-start" ? "Approves " + (it.lane === "bug" ? "bug.md" : "plan.md") + ", then runs" : "Runs") +
      " the rest: tasks, each task in a new session, review (fix rounds for Blockers), and PR text. Stops when it needs you. Never pushes.";
  }
  // Only while autopilot runs or needs you. Starting it is the main button on the Next line.
  function autoHtml(it) {
    if (!LIVE || !L || it.kind !== "item") return "";
    var a = itemAuto(it);
    if (!a || (a.status !== "running" && a.status !== "waiting")) return "";
    var log = a.log && a.log.length ? "<details" + openAttr("a:" + it.folder, false) + "><summary>Autopilot log</summary>" +
      '<ul class="hist">' + a.log.slice().reverse().map(function (x) { return "<li>" + h(timeOf(Date.parse(x.at))) + " " + h(x.text) + "</li>"; }).join("") + "</ul></details>" : "";
    var rounds = a.fixRounds ? '<span class="then">fix round ' + a.fixRounds + " of " + a.maxFixRounds + "</span>" : "";
    if (a.status === "running") {
      return '<div class="auto run"><div class="auto-head"><span class="state"><span class="spin" aria-hidden="true"></span>Autopilot</span>' +
        (a.command ? '<span class="then" title="' + h(a.command) + '">' + h(cmdWords(it, a.command.replace(/\s+auto$/, ""))) + "</span>" : "") + rounds +
        '<span class="row">' + autoBtn(it, "stop", "Stop after this step", "", "The current step finishes. Nothing runs after it.") + "</span></div>" + log + "</div>";
    }
    return '<div class="auto wait"><div class="auto-head"><span class="state">Autopilot needs you</span>' + rounds +
      '<span class="row">' + autoBtn(it, "resume", "Resume", "primary", "Re-reads .work and runs the next step") + autoBtn(it, "stop", "Stop", "", "Turn autopilot off for this item") + "</span></div>" +
      '<p class="msg">' + md(a.message || "") + "</p>" + log + "</div>";
  }

  function agentHtml(it) {
    if (!LIVE || !L) return "";
    var s = itemSession(it);
    var perms = itemPerms(it), qs = itemQs(it);
    var links = L.items[it.folder];
    if (!s && !perms.length && !qs.length) return "";
    var busy = isBusy(s);
    var ask = perms.length + qs.length > 0;
    var out = '<div class="agent' + (ask ? " asking" : busy ? " busy" : "") + '">';

    if (s) {
      var state = ask ? "Waiting for you" : busy ? (s.status === "retry" ? "Retrying" : "Working") : (s.error ? "Stopped" : "Done");
      out += '<div class="agent-head"><span class="state">' + (busy && !ask ? '<span class="spin" aria-hidden="true"></span>' : "") + h(state) + "</span>" +
        (s.command ? '<span class="cmdname">' + h(s.command) + "</span>" : "") +
        '<span class="row">' +
        (busy ? '<button type="button" class="btn danger" data-abort="' + h(s.id) + '">Stop</button>' : "") +
        (L.canOpenTerminal ? '<button type="button" class="btn" data-term="' + h(s.id) + '" title="Opens the opencode TUI on this session">Open in terminal</button>' : "") +
        copyBtn(s.attach, "Copy terminal command") + "</span></div>";
      if (busy && s.activity && !ask) out += '<div class="activity" title="' + h(s.activity) + '">' + h(s.activity) + "</div>";
      if (s.error) out += '<p class="err">' + h(s.error) + "</p>";
    }

    perms.forEach(function (p) { out += permHtml(p, false); });
    qs.forEach(function (q) { out += questionHtml(q, false); });

    if (s && s.text) {
      var writing = busy && s.textAt && s.busySince && s.textAt >= s.busySince;
      out += '<p class="say-h">' + (writing ? "Agent is writing" : "Agent said") + (s.textAt ? " (" + ago(s.textAt) + ")" : "") + "</p>" +
        '<pre class="say"' + (writing ? " data-follow" : "") + ">" + h(s.text) + "</pre>";
    }
    if (s && !busy) {
      var dk = "r:" + s.id;
      out += '<div class="reply"><textarea data-draft="' + h(dk) + '" data-sid="' + h(s.id) + '" placeholder="Reply to the agent, or type a command (for example /status ' + h(it.id || it.folder) + '). Ctrl+Enter sends." aria-label="Reply to the agent">' +
        h(ui.drafts[dk] || "") + '</textarea><button type="button" class="btn" data-reply="' + h(s.id) + '">Send</button></div>';
    }
    if (links && links.sessions.length > 1) {
      var older = links.sessions.slice(0, -1).reverse();
      out += "<details" + openAttr("h:" + it.folder, false) + "><summary>Earlier sessions for this item (" + older.length + ")</summary>" +
        '<ul class="hist" style="margin-top:6px">' + older.map(function (x) {
          return '<li><span class="ht" title="' + h(x.id) + '">' + h(x.title || x.command || x.id) + "</span>" +
            (L.canOpenTerminal ? '<button type="button" class="btn" data-term="' + h(x.id) + '">Open</button>' : "") + "</li>";
        }).join("") + "</ul></details>";
    }
    return out + "</div>";
  }

  // The item in "Pick up here" is not drawn twice: its group gets this one line instead.
  function pickedRow(it) {
    return '<a class="picked" href="#pickup-h" style="--state:' + stateVar(it) + '"><span class="num">#' + h(it.id) + "</span>" +
      '<span class="pt">' + h(it.title) + '</span><span class="dim">In Pick up here</span></a>';
  }

  function agentNote(it) {
    var s = itemSession(it);
    if (!LIVE || (!isBusy(s) && !asking(it))) return "";
    return '<p class="note">' + (asking(it) ? "The agent is waiting for you" : "The agent is working") + ': see <a href="#pickup-h">Pick up here</a>.</p>';
  }

  // Prompts from sessions that are not linked to a .work item (for example, started in the TUI).
  function waitingHtml() {
    if (!LIVE || !L) return "";
    var perms = L.permissions.filter(function (p) { return !p.folder; });
    var qs = L.questions.filter(function (q) { return !q.folder; });
    if (!perms.length && !qs.length) return "";
    return '<section class="waiting" aria-label="Waiting for you"><h3 style="margin:0;font-size:15px">Waiting for you</h3>' +
      perms.map(function (p) { return permHtml(p, true); }).join("") + qs.map(function (q) { return questionHtml(q, true); }).join("") + "</section>";
  }

  // ------------------------------------------------------------- repo flags
  function repoFlags(g, expected, paused) {
    var f = [];
    if (!g) return f;
    if (!g.exists) return [["bad", "Folder missing"]];
    if (!g.isGit) return [["bad", "Not a git repo"]];
    if (g.detached) f.push(["warn", "Detached HEAD"]);
    if (expected && g.branch && g.branch !== expected) f.push([paused ? "info" : "bad", "On " + g.branch + (paused ? " (item is paused)" : "")]);
    if (g.changed) f.push(["warn", plural(g.changed, "uncommitted file")]);
    if (g.ahead) f.push(["info", plural(g.ahead, "unpushed commit")]);
    if (g.behind) f.push(["info", g.behind + " behind remote"]);
    if (g.gone) f.push(["info", "Remote branch deleted"]);
    if (g.branch && !g.upstream && g.branch !== g.defaultBranch) {
      f.push(["info", g.unpushed ? "Not pushed (" + plural(g.unpushed, "commit") + ")" : "Not pushed"]);
    }
    if (!f.length) f.push(["ok", g.upstream ? "Clean, pushed" : "Clean"]);
    return f;
  }
  function flagsHtml(f) {
    return f.map(function (x) { return '<span class="flag ' + x[0] + '">' + h(x[1]) + "</span>"; }).join("");
  }

  function reposTable(it) {
    if (!it.repos || !it.repos.length) return '<p class="dim" style="margin:0">No repos.md yet.</p>';
    var rows = it.repos.map(function (r) {
      var g = r.git || {};
      var l = r.links || {};
      var links = [];
      if (l.branch) links.push(link(l.branch, "Branch"));
      if (l.pr) links.push(link(l.pr, "Create PR"));
      var last = g.lastSha ? '<span class="dim mono">' + h(g.lastSha) + "</span> " + h(g.lastMsg) : '<span class="dim">none</span>';
      return "<tr><td><strong>" + h(r.folder) + "</strong>" + (r.shared ? ' <span class="tag">shared</span>' : "") +
        '<br><span class="branch">' + h(r.branch || "no branch") + "</span></td>" +
        "<td>" + flagsHtml(repoFlags(g, r.branch, !!it.paused)) + "</td>" +
        "<td>" + last + "</td>" +
        '<td><div class="links">' + (links.join("") || '<span class="dim">no links</span>') + "</div></td></tr>";
    }).join("");
    return '<div class="tbl-wrap"><table><thead><tr><th>Repo</th><th>State</th><th>Last commit</th><th>Links</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }

  function tasksHtml(it) {
    var t = it.tasks;
    if (!t || !t.total) return "";
    var firstOpen = null;
    t.list.forEach(function (x) { if (!x.done && (firstOpen === null || x.n < firstOpen)) firstOpen = x.n; });
    var li = t.list.map(function (x) {
      return '<li class="' + (x.done ? "done" : "") + (x.n === firstOpen ? " first" : "") + '"><span class="box" aria-hidden="true"></span><span class="tt">' +
        h(x.n + ". " + x.title) + (x.repo ? ' <span class="rp">' + h(x.repo) + "</span>" : "") + "</span></li>";
    }).join("");
    return '<div><p class="sub-h">Tasks <span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * t.done / t.total) + '%"></i></span> ' + t.done + " of " + t.total + ' done</p><ul class="tasks">' + li + "</ul></div>";
  }

  function kitHtml(lines, it) {
    if (LIVE) {
      // Live: the page runs commands itself. Offer the TUI on this item's session instead.
      var s = it ? itemSession(it) : null;
      var cmd = s ? s.attach : (L && L.opencode ? L.opencode.attach : null);
      if (!cmd) return "";
      return '<div class="kit"><div class="kit-head"><span>Work in the terminal (opencode TUI on ' + (s ? "this item's session" : "this server") + ")</span></div>" +
        '<div class="kit-line"><code>' + h(cmd) + "</code>" + copyBtn(cmd) + "</div></div>";
    }
    if (!lines || !lines.length) return "";
    return '<div class="kit"><div class="kit-head"><span>After a restart, paste these into a terminal</span>' + copyBtn(lines.join("\n"), "Copy all") + "</div>" +
      lines.map(function (l) { return '<div class="kit-line"><code>' + h(l) + "</code>" + copyBtn(l) + "</div>"; }).join("") + "</div>";
  }

  function filesHtml(it) {
    if (!it.files || !it.files.length) return "";
    return '<div><p class="sub-h">Files</p><div class="files">' + it.files.map(function (f) {
      return '<a href="' + fileHref(it.folder, f) + '" target="_blank">' + h(f) + "</a>";
    }).join("") + "</div></div>";
  }

  // ------------------------------------------------------------- PR text (ready to ship)
  function prHtml(it) {
    if (!it.pr || !it.pr.length) return "";
    var cards = it.pr.map(function (p) {
      var ps = p.push;
      var link = p.links && p.links.pr;
      var where = link && /\/_git\//.test(link) ? "ADO" : link && /github\.com\//i.test(link) ? "GitHub" : "";
      var pushed = ps && ps.remote && !ps.unpushed;
      var flag = !ps ? ["warn", "Repo not found"] : !ps.local && !ps.remote ? ["bad", "Branch not found"] : !ps.remote ? ["warn", "Not pushed yet"] : ps.unpushed ? ["warn", plural(ps.unpushed, "commit") + " not pushed"] : ["ok", "Pushed"];
      var head = '<div class="pr-head"><span class="rn">' + h(p.repo) + "</span>" +
        '<span class="branch">' + h(p.branch || "no branch") + " → " + h(p.target || "main") + "</span>" + flagsHtml([flag]) +
        '<span class="row">' + (link ? '<a class="btn' + (pushed ? " primary" : "") + '" href="' + h(link) + '" target="_blank" rel="noopener" title="Opens the new pull request page with the branches filled in">Create PR' + (where ? " in " + where : "") + "</a>" : '<span class="dim" style="font-size:13px">No PR link: the repo has no origin remote</span>') + "</span></div>";
      var pk = "p:" + it.folder + ":" + p.repo;
      var pushBtn = LIVE && conn === "on" ? '<button type="button" class="btn primary" data-push="' + h(it.folder) + '" data-repo="' + h(p.repo) + '" title="Runs this command now. Your click is the approval."' + (ui.busy[pk] ? " disabled" : "") + ">" + (ui.busy[pk] ? "Pushing..." : "Push") + "</button>" : "";
      var push = !pushed && p.pushCmd && ps && ps.local ? '<div class="pr-push"><span class="dim">Push first:</span><code>' + h(p.pushCmd) + "</code>" + (pushBtn || copyBtn(p.pushCmd)) + "</div>" : "";
      var title = p.title ? '<div class="pr-field"><div class="fh"><p class="sub-h">Title</p>' + copyBtn(p.title, "Copy title") + '</div><div class="pr-title">' + h(p.title) + "</div></div>"
        : '<p class="dim" style="margin:0">No title in pr.md for this repo.</p>';
      var desc = p.description ? '<div class="pr-field"><div class="fh"><p class="sub-h">Description</p>' + copyBtn(p.description, "Copy description") + '</div><pre class="pr-desc">' + h(p.description) + "</pre></div>" : "";
      return '<div class="pr">' + head + push + title + desc + "</div>";
    }).join("");
    var file = it.files && it.files.indexOf("pr.md") >= 0 ? ' <a href="' + fileHref(it.folder, "pr.md") + '" target="_blank" rel="noopener" style="text-transform:none;letter-spacing:0;font-weight:500">pr.md</a>' : "";
    return '<div class="prbox"><p class="sub-h">Pull requests' + file + "</p>" + cards + "</div>";
  }

  // ------------------------------------------------------------- remove (live)

  // ---------------------------------------------------------------- alerts (live)

  var canNotify = LIVE && typeof window.Notification === "function";

  var seenPrompts = null, wasBusy = {}, wasAuto = {};

    }).concat(L.questions.map(function (q) {

    }));
    document.title = (prompts.length ? "(" + prompts.length + ") " : "") + "Work dashboard";

  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { }
    document.body.removeChild(ta);
  }

  function connect() {
    var es = new EventSource("api/events?token=" + encodeURIComponent(D.liveMode.token));
    es.addEventListener("model", function (e) {
      var d = JSON.parse(e.data);
      D = d; L = d.liveMode.live; conn = "on"; watchForAlerts(); watchForUpdates(); schedule();
    });
    es.addEventListener("live", function (e) { L = JSON.parse(e.data); conn = "on"; watchForAlerts(); watchForUpdates(); schedule(); });
    es.onopen = function () { conn = "on"; schedule(); };
    es.onerror = function () {
      conn = "off"; schedule();
      // A restarted server has a new token, so the stream is refused: reload once the server answers.
      if (es.readyState === 2) waitThenReload();
    };
  }

  function waitThenReload() {
    fetch("api/ping", { cache: "no-store" }).then(function (r) {
      if (r.ok) location.reload(); else throw new Error();
    }).catch(function () { setTimeout(waitThenReload, 3000); });
  }

  wire();
  render();
  if (LIVE) {
    connect();
    setInterval(schedule, 30000); // keep "x min ago" fresh
  } else {
    checkLive();
    setInterval(checkLive, 15000);
  }
})();
</script>
</body>
</html>
