<form (ngSubmit)="load()">
  <label for="order-id">Order number</label>
  <input id="order-id" name="orderId" type="number" data-testid="order-id" [(ngModel)]="orderId" />
  <button type="submit" data-testid="load-order">Load</button>
</form>

@if (error(); as message) {
  <p class="error" data-testid="order-error">{{ message }}</p>
}

@if (summary(); as s) {
  <table data-testid="order-summary">
    <caption>Order {{ s.orderId }} ({{ s.itemCount }} lines)</caption>
    <tr><th>Subtotal</th><td data-testid="summary-subtotal">{{ formatMoney(s.subtotal) }}</td></tr>
    <tr><th>Shipping</th><td data-testid="summary-shipping">{{ formatMoney(s.shipping) }}</td></tr>
    <tr><th>Discount</th><td data-testid="summary-discount">-{{ formatMoney(s.discount) }}</td></tr>
    <tr><th>Total</th><td data-testid="summary-total">{{ formatMoney(s.total) }}</td></tr>
  </table>
}
