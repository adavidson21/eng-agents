name: checks
# Pull requests, and pushes to main. Runs the self-tests that need no opencode, no ADO and no network.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  product-notes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: ./core/scripts/notes/Test-ProductNotes.ps1
      - run: ./core/scripts/ado/Test-ExportBacklog.ps1
      - run: ./core/scripts/github/Test-GitHub.ps1
      - run: ./core/scripts/workshop/Test-WorkshopTool.ps1
      - run: ./core/scripts/briefs/Test-ExportBrief.ps1
      - run: ./core/scripts/stats/Test-PipelineStats.ps1
      - run: ./tests/Test-Guards.ps1
      - run: ./core/scripts/work/Test-WorkScripts.ps1
      - run: ./core/scripts/ui/Test-UiScript.ps1
  ui-checks:
    # The UI check's PNG diff, argument and problem helpers (node --test). The real browser run is skipped here
    # (no Playwright install in CI); it runs locally with UI_TEST_PLAYWRIGHT_DIR set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "core/scripts/ui/test/*.test.mjs"
  work-format:
    # Tandem writes .work; Workshop's Dispatch reads it. Check this repo's parser against Workshop's contract
    # (docs/work-format.md and its example workspace), on pwsh and on Windows PowerShell 5.1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: adavidson21/workshop, path: workshop }
      - run: ./core/scripts/dashboard/Test-WorkFormat.ps1 -Workshop workshop
      - run: ./core/scripts/stats/Test-HealthFormat.ps1 -Workshop workshop
  eval-graders:
    # The eval graders must pass hand-written good outputs and fail bad ones. No model, no dotnet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: ./evals/Test-Graders.ps1
      - run: ./evals/Test-Harness.ps1
      - run: ./evals/Get-PromptSize.ps1
      - run: ./evals/Test-AgentGuards.ps1
      - run: ./evals/Test-Judge.ps1
      - run: ./evals/Get-PromptSize.ps1 -Check
        if: matrix.shell == 'pwsh'
  eval-fixtures:
    # The eval fixtures must behave as the cases assume (builds, planted bug is real). Needs dotnet, no model.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: ./evals/Test-Fixtures.ps1
  agent-frontmatter:
    # opencode skips an agent whose frontmatter repeats a key, and Dispatch then says "Agent not found".
    # Install into a scratch folder and check every installed agent for repeated keys.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          $target = Join-Path ([IO.Path]::GetTempPath()) "oc-check"
          ./install.ps1 -Target $target -CoreOnly
          $bad = 0
          foreach ($f in Get-ChildItem (Join-Path $target "agents") -Filter *.md) {
            $fm = ((Get-Content $f.FullName -Raw) -split "(?m)^---\s*$")[1]
            $seen = @{}; $path = @()
            foreach ($line in $fm -split "`r?`n") {
              $m = [regex]::Match($line, '^(\s*)("(?:[^"\\]|\\.)*"|[A-Za-z_][\w-]*)\s*:')
              if (-not $m.Success) { continue }
              $depth = $m.Groups[1].Value.Length
              $path = @($path | Where-Object { $_.d -lt $depth })
              $full = (($path | ForEach-Object { $_.k }) + $m.Groups[2].Value) -join " > "
              if ($seen.ContainsKey($full)) { Write-Host "::error::$($f.Name) repeats $full"; $bad++ }
              $seen[$full] = $true
              $path += [pscustomobject]@{ d = $depth; k = $m.Groups[2].Value }
            }
          }
          if ($bad) { exit 1 }
          Write-Host "Agent frontmatter: no repeated keys."
